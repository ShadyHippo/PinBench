# Pinyin-to-Character Benchmark Configuration
# 
# Usage: python run_benchmark.py -c benchmark_config.yaml
# 
# Configure providers for different model APIs:
# - featherless: Featherless.ai (recommended for small models)
# - together: Together.ai
# - openai: OpenAI API
# - ollama: Local Ollama server
# - local: Local OpenAI-compatible server (llama.cpp, vLLM, etc.)
# - mock: For testing without API keys

name: "pinyin_benchmark_v1"
test_file: "test_cases.json"

# Model providers to benchmark
# Add your API keys as environment variables or in the config
providers:
  # Featherless.ai - good selection of small models
  - type: "featherless"
    model: "meta-llama/Llama-3.2-3B-Instruct"
    provider_name: "featherless"
    temperature: 0.0
    max_tokens: 2048
    timeout: 120
  
  - type: "featherless"
    model: "Qwen/Qwen2.5-3B-Instruct"
    provider_name: "featherless"
    temperature: 0.0
    max_tokens: 2048
    timeout: 120
  
  - type: "featherless"
    model: "microsoft/Phi-3.5-mini-instruct"
    provider_name: "featherless"
    temperature: 0.0
    max_tokens: 2048
    timeout: 120
  
  - type: "featherless"
    model: "google/gemma-2-2b-it"
    provider_name: "featherless"
    temperature: 0.0
    max_tokens: 2048
    timeout: 120

  # Together.ai alternative
  # - type: "together"
  #   model: "meta-llama/Llama-3.2-3B-Instruct-Turbo"
  #   provider_name: "together"
  #   temperature: 0.0
  #   max_tokens: 2048
  #   timeout: 120

  # Local Ollama (uncomment and run: ollama serve)
  # - type: "ollama"
  #   model: "llama3.2:3b"
  #   provider_name: "ollama"
  #   temperature: 0.0
  #   num_predict: 2048
  #   timeout: 300

  # Local llama.cpp server (uncomment and run llama.cpp server)
  # - type: "local"
  #   model: "llama-3.2-3b-instruct"
  #   api_base: "http://localhost:8080/v1"
  #   provider_name: "llamacpp"
  #   temperature: 0.0
  #   max_tokens: 2048

# Benchmark execution settings
runs_per_model: 3          # Number of times to run each test per model
max_workers: 1
timeout_per_request: 300   # Seconds
retry_failed: 0            # Retry failed requests

# Output settings
output_dir: "results"
save_raw_responses: true   # Save full model outputs
save_results_json: true    # Save detailed grading results
save_results_csv: true     # Save CSV for analysis
print_progress: true       # Print progress to console

# Optional filters (comment out to run all tests)
# filter_categories:
#   - "basic_command"
#   - "english_names"
#   - "mixed_english"
# filter_test_ids:
#   - 1
#   - 2
#   - 3

# Override system prompt (optional, uses test_cases.json default if not set)
# system_prompt_override: |
#   Your custom system prompt here...